services:
  postgres:
    image: postgres:16-alpine
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: verana
      POSTGRES_PASSWORD: verana
      POSTGRES_DB: verana_graph
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U verana -d verana_graph']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
