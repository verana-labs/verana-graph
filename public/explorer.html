<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verana Graph Explorer</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: #0b1120;
  color: #e2e8f0;
  font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
#topbar {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 16px;
  height: 52px;
  flex: none;
  background: #0f172a;
  border-bottom: 1px solid #1e293b;
}
#topbar h1 { font-size: 15px; font-weight: 600; white-space: nowrap; }
#surface, #search {
  background: #1e293b;
  color: #e2e8f0;
  border: 1px solid #334155;
  border-radius: 6px;
  padding: 6px 10px;
  font: inherit;
  font-size: 13px;
}
#search { width: 340px; }
#surface:focus, #search:focus { outline: 1px solid #64748b; }
#count { color: #94a3b8; font-size: 12px; white-space: nowrap; }
#health {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 7px;
  background: #1e293b;
  border: 1px solid #334155;
  border-radius: 999px;
  padding: 4px 12px;
  font-size: 12px;
  color: #cbd5e1;
  white-space: nowrap;
}
#health .dot { width: 8px; height: 8px; border-radius: 50%; background: #64748b; }
#health.ok .dot { background: #4ade80; }
#health.bad .dot { background: #f87171; }
main { flex: 1; display: flex; min-height: 0; }
#stage { flex: 1; position: relative; min-width: 0; }
#canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
#legend {
  position: absolute;
  left: 14px;
  bottom: 14px;
  background: rgba(15, 23, 42, 0.92);
  border: 1px solid #1e293b;
  border-radius: 8px;
  padding: 10px 14px;
  font-size: 12px;
  color: #cbd5e1;
  display: grid;
  gap: 5px;
  pointer-events: none;
}
#legend .row { display: flex; align-items: center; gap: 8px; }
#legend .swatch { width: 10px; height: 10px; border-radius: 50%; flex: none; }
#legend .line { width: 22px; height: 0; flex: none; }
#toasts {
  position: absolute;
  top: 14px;
  right: 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  max-width: 380px;
  z-index: 5;
}
.toast {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  background: #1e293b;
  border: 1px solid #475569;
  border-left: 3px solid #fbbf24;
  border-radius: 6px;
  padding: 9px 12px;
  font-size: 13px;
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
  word-break: break-word;
}
.toast button {
  background: none;
  border: none;
  color: #94a3b8;
  cursor: pointer;
  font-size: 15px;
  line-height: 1.2;
  padding: 0;
}
#panel {
  width: 330px;
  flex: none;
  background: #0f172a;
  border-left: 1px solid #1e293b;
  overflow-y: auto;
  padding: 16px;
}
#panel-empty { color: #64748b; font-size: 13px; margin-top: 8px; }
#panel-kind {
  display: inline-block;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: #94a3b8;
  background: #1e293b;
  border-radius: 4px;
  padding: 2px 8px;
  margin-bottom: 8px;
}
#panel-title { font-size: 14px; font-weight: 600; word-break: break-all; margin-bottom: 12px; }
#panel-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
#panel-actions button {
  background: #1d4ed8;
  border: none;
  color: #fff;
  font: inherit;
  font-size: 12.5px;
  border-radius: 6px;
  padding: 6px 11px;
  cursor: pointer;
}
#panel-actions button:hover { background: #2563eb; }
#panel-actions button:disabled { background: #334155; color: #94a3b8; cursor: default; }
#panel-fields { font-size: 12.5px; }
#panel-fields dt { color: #94a3b8; margin-top: 8px; }
#panel-fields dd { color: #e2e8f0; word-break: break-all; }
</style>
</head>
<body>
<header id="topbar">
  <h1>Verana Graph Explorer</h1>
  <select id="surface">
    <option>Ecosystem</option>
    <option>Did</option>
    <option>Corporation</option>
    <option>CredentialSchema</option>
    <option>ServiceEndpoint</option>
  </select>
  <input id="search" type="search" placeholder="Search the graph, press Enter" autocomplete="off">
  <span id="count"></span>
  <div id="health"><span class="dot"></span><span id="health-text">connecting</span></div>
</header>
<main>
  <div id="stage">
    <canvas id="canvas"></canvas>
    <div id="legend">
      <div class="row"><span class="swatch" style="background:#a78bfa"></span>Ecosystem</div>
      <div class="row"><span class="swatch" style="background:#60a5fa"></span>Corporation</div>
      <div class="row"><span class="swatch" style="background:#2dd4bf"></span>DID</div>
      <div class="row"><span class="swatch" style="background:#4ade80"></span>Participant ACTIVE</div>
      <div class="row"><span class="swatch" style="background:#f87171"></span>Participant REVOKED / SLASHED</div>
      <div class="row"><span class="swatch" style="background:#fbbf24"></span>Participant other state</div>
      <div class="row"><span class="line" style="border-top:2px solid #cbd5e1"></span>validator chain</div>
      <div class="row"><span class="line" style="border-top:1px dashed #64748b"></span>membership / ownership</div>
    </div>
    <div id="toasts"></div>
  </div>
  <aside id="panel">
    <div id="panel-empty">Click a node to inspect it. Drag a node to pin it, double-click to unpin. Drag the background to pan, scroll to zoom.</div>
    <div id="panel-body" hidden>
      <div id="panel-kind"></div>
      <h2 id="panel-title"></h2>
      <div id="panel-actions"></div>
      <dl id="panel-fields"></dl>
    </div>
  </aside>
</main>
<script>
'use strict';
(() => {
  const MAX_NODES = 400;
  const COLORS = {
    Ecosystem: '#a78bfa',
    Corporation: '#60a5fa',
    Did: '#2dd4bf',
    green: '#4ade80',
    red: '#f87171',
    amber: '#fbbf24',
    other: '#94a3b8',
  };
  const RADII = { Ecosystem: 13, Corporation: 11, Did: 8, Participant: 7 };

  const nodes = new Map();
  const edges = new Map();
  let selected = null;
  let alpha = 0;
  let dirty = true;

  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const searchInput = document.getElementById('search');
  const surfaceSelect = document.getElementById('surface');
  const countEl = document.getElementById('count');
  const healthEl = document.getElementById('health');
  const healthText = document.getElementById('health-text');

  let dpr = 1;
  let width = 0;
  let height = 0;
  let zoom = 1;
  let panX = 0;
  let panY = 0;

  function resize() {
    dpr = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    panX += (rect.width - width) / 2;
    panY += (rect.height - height) / 2;
    width = rect.width;
    height = rect.height;
    canvas.width = Math.round(width * dpr);
    canvas.height = Math.round(height * dpr);
    dirty = true;
  }
  window.addEventListener('resize', resize);

  function toWorld(cx, cy) {
    return { x: (cx - panX) / zoom, y: (cy - panY) / zoom };
  }

  function viewCenter() {
    return toWorld(width / 2, height / 2);
  }

  function midTruncate(s, max) {
    if (s.length <= max) return s;
    const head = Math.ceil((max - 1) / 2);
    const tail = Math.floor((max - 1) / 2);
    return s.slice(0, head) + '…' + s.slice(s.length - tail);
  }

  function nodeLabel(n) {
    if (n.kind === 'Ecosystem') return 'Eco ' + n.id;
    if (n.kind === 'Corporation') return 'Corp ' + n.id;
    if (n.kind === 'Did') return midTruncate(String(n.id), 24);
    if (n.kind === 'Participant') return 'P' + n.id + (n.data.role ? ' ' + n.data.role : '');
    return n.kind + ' ' + midTruncate(String(n.id), 16);
  }

  function nodeColor(n) {
    if (n.kind === 'Participant') {
      const s = n.data.state;
      if (s === 'ACTIVE') return COLORS.green;
      if (s === 'REVOKED' || s === 'SLASHED') return COLORS.red;
      return COLORS.amber;
    }
    return COLORS[n.kind] || COLORS.other;
  }

  function toast(msg) {
    const el = document.createElement('div');
    el.className = 'toast';
    const text = document.createElement('span');
    text.textContent = msg;
    const close = document.createElement('button');
    close.textContent = '×';
    close.addEventListener('click', () => el.remove());
    el.append(text, close);
    document.getElementById('toasts').appendChild(el);
    setTimeout(() => el.remove(), 7000);
  }

  function errMsg(e) {
    if (e && e.code && e.message) return e.code + ': ' + e.message;
    if (e && e.message) return e.message;
    return 'request failed';
  }

  async function api(path, body) {
    const res = await fetch(path, {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify(body),
    });
    let json = null;
    try {
      json = await res.json();
    } catch (_e) {
      json = null;
    }
    if (json && json.error) throw json.error;
    if (!res.ok) throw { code: 'HTTP_' + res.status, message: res.statusText || 'request failed' };
    return json;
  }

  function traverse(query, input, limit) {
    const body = { query, input };
    if (limit) body.limit = limit;
    return api('/v4/graph/traverse', body);
  }

  function beginBatch() {
    return { added: 0, skipped: 0 };
  }

  function mergeNode(batch, kind, id, data, anchor) {
    const key = kind + ':' + id;
    const existing = nodes.get(key);
    if (existing) {
      if (data) Object.assign(existing.data, data);
      existing.label = nodeLabel(existing);
      return existing;
    }
    if (nodes.size >= MAX_NODES) {
      batch.skipped += 1;
      return null;
    }
    const base = anchor || viewCenter();
    const ang = Math.random() * Math.PI * 2;
    const rad = 50 + Math.random() * (anchor ? 60 : 160);
    const n = {
      key,
      kind,
      id,
      data: data ? { ...data } : {},
      x: base.x + Math.cos(ang) * rad,
      y: base.y + Math.sin(ang) * rad,
      vx: 0,
      vy: 0,
      fx: 0,
      fy: 0,
      pinned: false,
      r: RADII[kind] || 7,
      label: '',
    };
    n.label = nodeLabel(n);
    nodes.set(key, n);
    batch.added += 1;
    return n;
  }

  function mergeEdge(a, b, kind) {
    if (!a || !b || a === b) return;
    const k1 = a.key + '|' + b.key + '|' + kind;
    const k2 = b.key + '|' + a.key + '|' + kind;
    if (edges.has(k1) || edges.has(k2)) return;
    edges.set(k1, { a, b, kind });
  }

  function linkChains() {
    for (const n of nodes.values()) {
      if (n.kind !== 'Participant') continue;
      const v = n.data.validatorParticipantId;
      if (v === null || v === undefined) continue;
      mergeEdge(n, nodes.get('Participant:' + v), 'chain');
    }
  }

  function endBatch(batch) {
    linkChains();
    if (batch.skipped > 0) toast('showing first ' + nodes.size + ' nodes (cap ' + MAX_NODES + ')');
    if (batch.added > 0) alpha = 1;
    else if (batch.skipped === 0) toast('nothing new, everything from this expansion is already on the canvas');
    dirty = true;
  }

  function fitView() {
    if (nodes.size === 0) return;
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    for (const n of nodes.values()) {
      minX = Math.min(minX, n.x); maxX = Math.max(maxX, n.x);
      minY = Math.min(minY, n.y); maxY = Math.max(maxY, n.y);
    }
    const rect = canvas.getBoundingClientRect();
    const w = Math.max(maxX - minX, 120), h = Math.max(maxY - minY, 120);
    zoom = Math.min(1.4, Math.min(rect.width / (w + 200), rect.height / (h + 200)));
    panX = rect.width / 2 - ((minX + maxX) / 2) * zoom;
    panY = rect.height / 2 - ((minY + maxY) / 2) * zoom;
    dirty = true;
  }

  function fieldValue(v) {
    if (v === null || v === undefined) return 'null';
    if (typeof v === 'object') {
      const s = JSON.stringify(v);
      return s.length > 160 ? s.slice(0, 160) + '…' : s;
    }
    return String(v);
  }

  async function expandEcosystemMembers(node) {
    const res = await traverse('C2', { ecosystemId: node.id }, 100);
    const batch = beginBatch();
    for (const items of Object.values(res.output || {})) {
      for (const item of items) {
        const didNode = mergeNode(batch, 'Did', item.did.did, item.did, node);
        mergeEdge(node, didNode, 'member');
        const pNode = mergeNode(batch, 'Participant', item.participant.id, item.participant, didNode || node);
        mergeEdge(didNode, pNode, 'member');
      }
    }
    endBatch(batch);
  }

  async function expandDidTrust(node) {
    const res = await traverse('A1', { did: node.id });
    Object.assign(node.data, res.output || {});
    node.label = nodeLabel(node);
    const batch = beginBatch();
    const corpId = node.data.corporationId;
    if (corpId !== null && corpId !== undefined) {
      const corp = mergeNode(batch, 'Corporation', corpId, { id: corpId }, node);
      mergeEdge(node, corp, 'member');
    }
    endBatch(batch);
  }

  async function expandDidParticipants(node) {
    const res = await traverse('A7', { did: node.id }, 100);
    const batch = beginBatch();
    for (const item of res.output || []) {
      const data = { ...item.participant };
      if (item.schema && item.schema.title) data.schemaTitle = item.schema.title;
      const pNode = mergeNode(batch, 'Participant', item.participant.id, data, node);
      mergeEdge(node, pNode, 'member');
      if (item.ecosystem) {
        const eNode = mergeNode(batch, 'Ecosystem', item.ecosystem.id, item.ecosystem, pNode || node);
        mergeEdge(pNode, eNode, 'member');
      }
    }
    endBatch(batch);
  }

  async function expandDidGoverning(node) {
    const res = await traverse('A2', { did: node.id });
    const out = res.output || {};
    const batch = beginBatch();
    if (out.corporation) {
      const corp = mergeNode(batch, 'Corporation', out.corporation.id, out.corporation, node);
      mergeEdge(node, corp, 'member');
    }
    for (const eco of out.ecosystems || []) {
      const eNode = mergeNode(batch, 'Ecosystem', eco.id, eco, node);
      mergeEdge(node, eNode, 'member');
      if (eco.corporationId !== null && eco.corporationId !== undefined) {
        mergeEdge(eNode, nodes.get('Corporation:' + eco.corporationId), 'member');
      }
    }
    endBatch(batch);
  }

  async function expandCorporationDids(node) {
    const res = await traverse('E1', { corporationId: node.id }, 100);
    const batch = beginBatch();
    for (const ref of res.output || []) {
      const didNode = mergeNode(batch, 'Did', ref.did, ref, node);
      mergeEdge(node, didNode, 'member');
    }
    endBatch(batch);
  }

  async function expandParticipantChain(node) {
    const res = await traverse('G1', { participantId: node.id });
    const batch = beginBatch();
    let prev = null;
    for (const ref of res.output || []) {
      const pNode = mergeNode(batch, 'Participant', ref.id, ref, prev || node);
      if (prev && pNode) mergeEdge(prev, pNode, 'chain');
      if (ref.didId) {
        const didNode = mergeNode(batch, 'Did', ref.didId, { did: ref.didId }, pNode || node);
        mergeEdge(pNode, didNode, 'member');
      }
      prev = pNode || prev;
    }
    endBatch(batch);
  }

  const EXPANSIONS = {
    Ecosystem: [{ label: 'Members (C2)', run: expandEcosystemMembers }],
    Did: [
      { label: 'Trust summary (A1)', run: expandDidTrust },
      { label: 'Participants (A7)', run: expandDidParticipants },
      { label: 'Governing chain (A2)', run: expandDidGoverning },
    ],
    Corporation: [{ label: 'DIDs (E1)', run: expandCorporationDids }],
    Participant: [{ label: 'Validator chain (G1)', run: expandParticipantChain }],
  };

  function renderPanel() {
    const empty = document.getElementById('panel-empty');
    const body = document.getElementById('panel-body');
    if (!selected) {
      empty.hidden = false;
      body.hidden = true;
      return;
    }
    empty.hidden = true;
    body.hidden = false;
    document.getElementById('panel-kind').textContent = selected.kind;
    document.getElementById('panel-title').textContent =
      selected.kind === 'Did' ? String(selected.id) : selected.label;
    const actions = document.getElementById('panel-actions');
    actions.replaceChildren();
    const node = selected;
    for (const exp of EXPANSIONS[node.kind] || []) {
      const btn = document.createElement('button');
      btn.textContent = exp.label;
      btn.addEventListener('click', async () => {
        btn.disabled = true;
        try {
          await exp.run(node);
        } catch (e) {
          toast(errMsg(e));
        }
        btn.disabled = false;
        if (selected === node) renderPanel();
      });
      actions.appendChild(btn);
    }
    const dl = document.getElementById('panel-fields');
    dl.replaceChildren();
    for (const [k, v] of Object.entries(node.data)) {
      const dt = document.createElement('dt');
      dt.textContent = k;
      const dd = document.createElement('dd');
      dd.textContent = fieldValue(v);
      dl.append(dt, dd);
    }
  }

  function select(n) {
    selected = n;
    dirty = true;
    renderPanel();
  }

  let dragNode = null;
  let panning = false;
  let pointerDown = false;
  let moved = false;
  let downX = 0;
  let downY = 0;
  let lastX = 0;
  let lastY = 0;

  function pick(cx, cy) {
    const w = toWorld(cx, cy);
    const slack = 6 / zoom;
    let best = null;
    let bestD = Infinity;
    for (const n of nodes.values()) {
      const d = Math.hypot(n.x - w.x, n.y - w.y);
      if (d <= n.r + slack && d < bestD) {
        best = n;
        bestD = d;
      }
    }
    return best;
  }

  canvas.addEventListener('pointerdown', ev => {
    canvas.setPointerCapture(ev.pointerId);
    pointerDown = true;
    moved = false;
    downX = ev.offsetX;
    downY = ev.offsetY;
    lastX = downX;
    lastY = downY;
    dragNode = pick(downX, downY);
    panning = !dragNode;
    canvas.style.cursor = dragNode ? 'pointer' : 'grabbing';
  });

  canvas.addEventListener('pointermove', ev => {
    const x = ev.offsetX;
    const y = ev.offsetY;
    if (!pointerDown) {
      canvas.style.cursor = pick(x, y) ? 'pointer' : 'grab';
      return;
    }
    if (Math.hypot(x - downX, y - downY) > 4) moved = true;
    if (dragNode && moved) {
      const w = toWorld(x, y);
      dragNode.x = w.x;
      dragNode.y = w.y;
      dragNode.vx = 0;
      dragNode.vy = 0;
      dragNode.pinned = true;
      if (alpha < 0.3) alpha = 0.3;
      dirty = true;
    } else if (panning) {
      panX += x - lastX;
      panY += y - lastY;
      dirty = true;
    }
    lastX = x;
    lastY = y;
  });

  canvas.addEventListener('pointerup', ev => {
    pointerDown = false;
    if (!moved) select(pick(ev.offsetX, ev.offsetY));
    dragNode = null;
    panning = false;
    canvas.style.cursor = 'grab';
  });

  canvas.addEventListener('dblclick', ev => {
    const n = pick(ev.offsetX, ev.offsetY);
    if (n && n.pinned) {
      n.pinned = false;
      if (alpha < 0.5) alpha = 0.5;
      dirty = true;
    }
  });

  canvas.addEventListener(
    'wheel',
    ev => {
      ev.preventDefault();
      const factor = Math.exp(-ev.deltaY * 0.0012);
      const nz = Math.min(4, Math.max(0.15, zoom * factor));
      const wx = (ev.offsetX - panX) / zoom;
      const wy = (ev.offsetY - panY) / zoom;
      panX = ev.offsetX - wx * nz;
      panY = ev.offsetY - wy * nz;
      zoom = nz;
      dirty = true;
    },
    { passive: false },
  );

  function simStep() {
    const arr = [...nodes.values()];
    for (const n of arr) {
      n.fx = 0;
      n.fy = 0;
    }
    for (let i = 0; i < arr.length; i++) {
      const a = arr[i];
      for (let j = i + 1; j < arr.length; j++) {
        const b = arr[j];
        let dx = a.x - b.x;
        let dy = a.y - b.y;
        let d2 = dx * dx + dy * dy;
        if (d2 < 1) {
          dx = Math.random() - 0.5;
          dy = Math.random() - 0.5;
          d2 = 1;
        }
        if (d2 > 160000) continue;
        const d = Math.sqrt(d2);
        const f = 2200 / d2;
        const ux = dx / d;
        const uy = dy / d;
        a.fx += ux * f;
        a.fy += uy * f;
        b.fx -= ux * f;
        b.fy -= uy * f;
      }
    }
    for (const e of edges.values()) {
      const dx = e.b.x - e.a.x;
      const dy = e.b.y - e.a.y;
      const d = Math.sqrt(dx * dx + dy * dy) || 1;
      const rest = e.kind === 'chain' ? 110 : 90;
      const f = (d - rest) * 0.03;
      const ux = dx / d;
      const uy = dy / d;
      e.a.fx += ux * f;
      e.a.fy += uy * f;
      e.b.fx -= ux * f;
      e.b.fy -= uy * f;
    }
    for (const n of arr) {
      if (n.pinned || n === dragNode) continue;
      n.fx -= n.x * 0.003;
      n.fy -= n.y * 0.003;
      n.vx = (n.vx + n.fx * alpha) * 0.82;
      n.vy = (n.vy + n.fy * alpha) * 0.82;
      const v = Math.hypot(n.vx, n.vy);
      if (v > 8) {
        n.vx *= 8 / v;
        n.vy *= 8 / v;
      }
      n.x += n.vx;
      n.y += n.vy;
    }
    alpha = alpha < 0.015 ? 0 : alpha * 0.99;
  }

  function drawEdges(kind) {
    ctx.beginPath();
    for (const e of edges.values()) {
      if (e.kind !== kind) continue;
      ctx.moveTo(e.a.x, e.a.y);
      ctx.lineTo(e.b.x, e.b.y);
    }
    ctx.stroke();
  }

  function draw() {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#0b1120';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.setTransform(dpr * zoom, 0, 0, dpr * zoom, dpr * panX, dpr * panY);

    ctx.lineWidth = 1 / zoom;
    ctx.strokeStyle = 'rgba(100, 116, 139, 0.45)';
    ctx.setLineDash([5 / zoom, 5 / zoom]);
    drawEdges('member');
    ctx.setLineDash([]);
    ctx.lineWidth = 1.6 / zoom;
    ctx.strokeStyle = 'rgba(203, 213, 225, 0.85)';
    drawEdges('chain');

    for (const n of nodes.values()) {
      ctx.beginPath();
      ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
      ctx.fillStyle = nodeColor(n);
      ctx.fill();
      ctx.lineWidth = 1 / zoom;
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
      ctx.stroke();
      if (n.pinned) {
        ctx.beginPath();
        ctx.arc(n.x, n.y, n.r + 3 / zoom, 0, Math.PI * 2);
        ctx.setLineDash([2 / zoom, 2 / zoom]);
        ctx.strokeStyle = 'rgba(226, 232, 240, 0.7)';
        ctx.stroke();
        ctx.setLineDash([]);
      }
      if (n === selected) {
        ctx.beginPath();
        ctx.arc(n.x, n.y, n.r + 4 / zoom, 0, Math.PI * 2);
        ctx.lineWidth = 1.8 / zoom;
        ctx.strokeStyle = '#f8fafc';
        ctx.stroke();
      }
    }

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (zoom > 0.45) {
      ctx.font = '11px ui-sans-serif, system-ui, sans-serif';
      ctx.textAlign = 'center';
      for (const n of nodes.values()) {
        const sx = n.x * zoom + panX;
        const sy = n.y * zoom + panY;
        if (sx < -60 || sx > width + 60 || sy < -60 || sy > height + 60) continue;
        ctx.fillStyle = n === selected ? '#f1f5f9' : '#94a3b8';
        ctx.fillText(n.label, sx, sy + n.r * zoom + 13);
      }
    }
  }

  function frame() {
    if (alpha > 0) {
      simStep();
      dirty = true;
    }
    if (dirty) {
      draw();
      dirty = false;
    }
    requestAnimationFrame(frame);
  }

  function mergeHits(hits) {
    const batch = beginBatch();
    for (const hit of hits) {
      const n = mergeNode(batch, hit.type, hit.id, hit.snippet || {});
      if (!n) continue;
      const s = hit.snippet || {};
      if (s.corporationId !== null && s.corporationId !== undefined) {
        mergeEdge(n, nodes.get('Corporation:' + s.corporationId), 'member');
      }
      if (s.ecosystemId !== null && s.ecosystemId !== undefined) {
        mergeEdge(n, nodes.get('Ecosystem:' + s.ecosystemId), 'member');
      }
    }
    endBatch(batch);
  }

  function showCount(total) {
    countEl.textContent = total + (total === 1 ? ' result' : ' results');
  }

  async function runSearch() {
    const body = { surface: surfaceSelect.value, limit: 50 };
    const text = searchInput.value.trim();
    if (text) body.freeText = text;
    let res;
    try {
      res = await api('/v4/graph/search', body);
    } catch (e) {
      toast(errMsg(e));
      return;
    }
    showCount(res.totalCount);
    if (res.totalCount === 0) {
      toast('no results' + (text ? ' for "' + text + '"' : '') + ' on the ' + body.surface + ' surface');
      return;
    }
    mergeHits(res.hits || []);
    fitView();
  }

  searchInput.addEventListener('keydown', ev => {
    if (ev.key === 'Enter') runSearch();
  });
  surfaceSelect.addEventListener('change', runSearch);

  async function pollHealth() {
    try {
      const res = await fetch('/health');
      if (!res.ok) throw new Error('health ' + res.status);
      const j = await res.json();
      healthEl.classList.add('ok');
      healthEl.classList.remove('bad');
      healthText.textContent = j.lastAppliedBlock == null ? 'syncing' : 'block ' + j.lastAppliedBlock;
    } catch (_e) {
      healthEl.classList.add('bad');
      healthEl.classList.remove('ok');
      healthText.textContent = 'offline';
    }
    setTimeout(pollHealth, 5000);
  }

  async function init() {
    try {
      const res = await api('/v4/graph/search', { surface: 'Ecosystem', limit: 20 });
      showCount(res.totalCount);
      mergeHits(res.hits || []);
    } catch (e) {
      toast(errMsg(e));
    }
  }

  resize();
  requestAnimationFrame(frame);
  pollHealth();
  init();
})();
</script>
</body>
</html>
