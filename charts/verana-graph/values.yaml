replicaCount: 1

image:
  repository: veranalabs/verana-graph
  pullPolicy: IfNotPresent
  # Overrides the image tag (defaults to the chart appVersion when empty).
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

podAnnotations: {}

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 2Gi

# Extra environment variables injected into the container, merged after the
# values below. Use for anything not covered by `config`.
env: []

service:
  enabled: true
  type: ClusterIP
  port: 3100

# Application configuration, see .env.example for the full surface.
config:
  logLevel: info
  indexerBaseUrl: http://idx:3001
  indexerWsUrl: ""
  fetchGfDocBodies: "false"
  fetchVpBodies: "false"
  gateServiceEndpoints: "false"
  gapCoalesceThreshold: "1000"
  bpsMaxBufferedBytes: "1048576"
  trustRefreshIntervalMs: "300000"
  trustRefreshBatch: "200"
  nodeOptions: "--max-old-space-size=1536"

database:
  # When true, the chart runs its own PostgreSQL as a sidecar in the graph's StatefulSet, with a
  # retained volume, and the app connects on localhost. When false, point `host`/`port` at an
  # external PostgreSQL instead (e.g. a database co-located on the indexer's server).
  enabled: true
  # External connection target — used ONLY when `enabled: false`.
  host: ""
  port: 5432
  user: verana_graph
  db: verana_graph
  # Password shared by the embedded Postgres and the app connection. Always read from an existing
  # Kubernetes Secret — required. Provide {name, key}:
  #   pwdSecret:
  #     name: my-db-secret
  #     key: password
  pwdSecret: {}
  # urlSecret: supply the whole connection string from a Secret instead, which
  # takes precedence over everything above (and over the embedded Postgres host).
  urlSecret: {}
  # Embedded PostgreSQL — used ONLY when `enabled: true`.
  image:
    repository: postgres
    tag: '16-alpine'
    pullPolicy: IfNotPresent
  storage:
    size: 10Gi
    # '' uses the cluster's default StorageClass; set e.g. csi-cinder-classic on devnet.
    storageClassName: ''
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: '1'
      memory: 1Gi

ingress:
  enabled: false
  className: nginx
  host: ""
  tlsSecret: ""
  annotations: {}
  # The block-progress stream is a long-lived WebSocket, so the proxy read
  # timeout must outlast a quiet chain.
  websocketTimeoutSeconds: 3600

nodeSelector: {}
tolerations: []
affinity: {}
