apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "verana-graph.fullname" . }}
  labels:
    {{- include "verana-graph.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "verana-graph.fullname" . }}
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "verana-graph.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "verana-graph.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: NODE_ENV
              value: production
            - name: NODE_OPTIONS
              value: {{ .Values.config.nodeOptions | quote }}
            - name: PORT
              value: {{ .Values.service.port | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            - name: INDEXER_BASE_URL
              value: {{ .Values.config.indexerBaseUrl | quote }}
            - name: INDEXER_WS_URL
              value: {{ .Values.config.indexerWsUrl | quote }}
            - name: FETCH_GF_DOC_BODIES
              value: {{ .Values.config.fetchGfDocBodies | quote }}
            - name: FETCH_VP_BODIES
              value: {{ .Values.config.fetchVpBodies | quote }}
            - name: GATE_SERVICE_ENDPOINTS
              value: {{ .Values.config.gateServiceEndpoints | quote }}
            - name: GAP_COALESCE_THRESHOLD
              value: {{ .Values.config.gapCoalesceThreshold | quote }}
            - name: BPS_MAX_BUFFERED_BYTES
              value: {{ .Values.config.bpsMaxBufferedBytes | quote }}
            - name: TRUST_REFRESH_INTERVAL_MS
              value: {{ .Values.config.trustRefreshIntervalMs | quote }}
            - name: TRUST_REFRESH_BATCH
              value: {{ .Values.config.trustRefreshBatch | quote }}
            {{- if .Values.database.urlSecret.name }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.urlSecret.name }}
                  key: {{ .Values.database.urlSecret.key }}
            {{- else }}
            {{- include "verana-graph.postgresPasswordEnv" . | nindent 12 }}
            - name: DATABASE_URL
              value: postgres://{{ .Values.database.user }}:$(POSTGRES_PASSWORD)@{{ include "verana-graph.databaseHost" . }}:{{ .Values.database.port }}/{{ .Values.database.db }}
            {{- end }}
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if .Values.service.enabled }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 60
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
        {{- if .Values.database.enabled }}
        # Embedded Postgres, sidecar in the same pod — the app reaches it on localhost:5432
        - name: postgres
          image: "{{ .Values.database.image.repository }}:{{ .Values.database.image.tag }}"
          imagePullPolicy: {{ .Values.database.image.pullPolicy }}
          env:
            - name: POSTGRES_USER
              value: {{ .Values.database.user | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.database.db | quote }}
            {{- include "verana-graph.postgresPasswordEnv" . | nindent 12 }}
            # keep PGDATA in a subdirectory so a CSI volume's lost+found never collides with initdb
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          readinessProbe:
            exec:
              command: ['pg_isready', '-U', {{ .Values.database.user | quote }}, '-d', {{ .Values.database.db | quote }}]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ['pg_isready', '-U', {{ .Values.database.user | quote }}, '-d', {{ .Values.database.db | quote }}]
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.database.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if .Values.database.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
        annotations:
          # survive `helm uninstall`; a fresh bootstrap re-enumerates the whole DID universe,
          # so keeping the volume is cheaper than rebuilding the projection
          helm.sh/resource-policy: keep
      spec:
        accessModes: ['ReadWriteOnce']
        {{- if .Values.database.storage.storageClassName }}
        storageClassName: {{ .Values.database.storage.storageClassName | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.database.storage.size }}
  {{- end }}
