{{- if and .Values.ingress.enabled (eq (include "verana-graph.routeType" .) "gateway") }}
{{- $gw := .Values.ingress.gateway | default dict }}
# Gateway API route, for a cluster served by a Gateway instead of ingress-nginx.
# The Gateway listener named here terminates TLS, so ingress.tlsSecret, the
# className and the nginx annotations take no part in this mode.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "verana-graph.fullname" . }}
  labels:
    {{- include "verana-graph.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ required "ingress.gateway.name is needed when ingress.type is gateway" $gw.name }}
      {{- with $gw.namespace }}
      namespace: {{ . }}
      {{- end }}
      {{- with $gw.sectionName }}
      sectionName: {{ . }}
      {{- end }}
  hostnames:
    - {{ .Values.ingress.host | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      {{- with .Values.ingress.websocketTimeoutSeconds }}
      # The block-progress stream is a long-lived WebSocket, so the route must
      # outlast a quiet chain. Implementations that ignore timeouts keep their
      # own default.
      timeouts:
        request: {{ printf "%vs" . | quote }}
        backendRequest: {{ printf "%vs" . | quote }}
      {{- end }}
      backendRefs:
        - name: {{ include "verana-graph.fullname" . }}
          port: {{ .Values.service.port }}
{{- end }}
